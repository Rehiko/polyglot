<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | Polyglot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="simple-page">
    <header class="simple-header">
        <a class="auth-logo" href="index.html">POLYGLOT</a>
        <a class="back-link" href="login.html#login">Back to login</a>
    </header>

    <main class="reset-main">
        <section class="reset-card">
            <h1>Create a new password</h1>
            <p>Your new password must contain at least 8 characters, including a letter and a number.</p>

            <form id="newPasswordForm" novalidate>
                <div class="form-field">
                    <label for="newPassword">New password</label>
                    <div class="password-field">
                        <input id="newPassword" type="password" autocomplete="new-password" placeholder="Enter a new password" required minlength="8">
                        <button class="password-toggle" type="button" data-toggle-password="newPassword">Show</button>
                    </div>
                </div>

                <div class="form-field">
                    <label for="confirmNewPassword">Confirm password</label>
                    <div class="password-field">
                        <input id="confirmNewPassword" type="password" autocomplete="new-password" placeholder="Repeat your new password" required>
                        <button class="password-toggle" type="button" data-toggle-password="confirmNewPassword">Show</button>
                    </div>
                </div>

                <div id="passwordMessage" class="notice" role="status" aria-live="polite" hidden></div>
                <button class="primary-button" type="submit"><span>Update password</span><span aria-hidden="true">→</span></button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="reset-password.js"></script>
</body>

</html>
